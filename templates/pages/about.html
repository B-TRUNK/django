{% extends "base.html" %}


{% block content %}

<h4>{{file|capfirst|default:'not a name'|slice:':3'|add:' found'|cut:' '}}</h4>
<h4>{{size|filesizeformat}}</h4>

{% for i in file %}
    <p>{{ i }}</p>
{% endfor %}

<!--Working with Forms-->
<form method="POST">
  {% csrf_token %}
  <input type="text" name="username" id="" placeholder="username">
  <br>

  <input type="password" name="password" id=""  placeholder="password">
  <br>

  <input type="submit" id="" value="save">
</form>

{% endblock content %}
